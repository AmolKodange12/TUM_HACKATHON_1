<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f4; --ink: #151a23; --muted: #6b7280; --faint: #9ca3af;
    --card: rgba(255,255,255,.82); --line: #e2e5ea; --accent: #2f6b4f;
    --located: #0ca30c; --heard: #fab219; --unseen: #898781;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .ui { position: absolute; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  #title { top: 28px; left: 36px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -.5px; text-transform: uppercase; }
  #title .sub { color: var(--muted); font-size: 16px; margin-top: 4px; }
  #title .sub2 { color: var(--faint); font-size: 13px; margin-top: 4px; }
  #plan { pointer-events: auto; display: inline-block; margin-top: 10px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-weight: 600; font-size: 12px; text-decoration: none; backdrop-filter: blur(6px); }
  #plan:hover { background: #fff; }
  #left { left: 24px; top: 196px; bottom: 96px; width: 304px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 0 4px 2px 12px; }
  #legend { margin-top: auto; width: 280px; }
  .pill { display: inline-block; background: var(--accent); color: #fff; font-weight: 600; font-size: 11px; letter-spacing: .5px; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; }
  #legend h2 { margin: 8px 0 2px; font-size: 20px; font-weight: 800; }
  #legend .src { color: var(--muted); margin-bottom: 8px; }
  #ramp { height: 12px; border-radius: 2px; background: linear-gradient(90deg, #4f6b2f, #8a8f45, #c9b97a, #ece2bd); }
  .ramp-l { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin: 10px 8px 0 0; backdrop-filter: blur(6px); }
  .seg button { border: 0; background: none; font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .card .seg { margin: 0 6px 8px 0; background: #fff; }
  #bar { left: 50%; transform: translateX(-50%); bottom: 28px; width: min(760px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px); }
  #play { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-size: 12px; }
  #seek { flex: 1; accent-color: var(--ink); }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 92px; }
  #speed, .card select { font: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 3px; }
  #cards { top: 24px; right: 24px; width: 268px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 120px); overflow-y: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); }
  .card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
  .card h3 span { color: var(--faint); font-weight: 400; }
  .card svg { width: 100%; height: 48px; display: block; }
  details.card > summary { font-size: 13px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; margin-bottom: 0; }
  details.card > summary::after { content: '▾'; color: var(--faint); }
  details.card:not([open]) > summary::after { content: '▸'; }
  details.card[open] > summary { margin-bottom: 8px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; color: var(--muted); }
  .opt select, .opt input[type=range] { width: 150px; }
  .opt input[type=range] { accent-color: var(--ink); }
  .checks { display: grid; grid-template-columns: repeat(3, auto); gap: 3px 10px; margin: 8px 0 4px; }
  .pair { display: flex; gap: 6px; } .pair select { flex: 1; min-width: 0; }
  .opt #h-alt { flex: 1; width: auto; min-width: 0; } .opt #h-alt-l { min-width: 98px; white-space: nowrap; }
  .inline { display: flex; align-items: center; gap: 4px; color: var(--ink); cursor: pointer; } .inline input { accent-color: var(--ink); margin: 0; }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .checks input { accent-color: var(--ink); margin: 0; }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .keys i, .st i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  .hint { color: var(--faint); font-size: 12px; }
  #h-ramp { height: 10px; border-radius: 2px; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .row:hover, .row.sel { background: rgba(0,0,0,.05); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .row .v { margin-left: auto; color: var(--ink); }
  .row .v.off { color: var(--faint); }
  .drow .v { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .drow .st { color: var(--ink); }
  #why { right: 304px; bottom: 96px; width: 300px; display: none; }
  #why table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #why td { padding: 2px 0; }
  #why td:last-child { text-align: right; }
  #why tr.sum td { border-top: 1px solid var(--line); font-weight: 600; padding-top: 4px; }
  #why .bar { height: 4px; background: #d1d5db; border-radius: 2px; margin-top: 2px; }
  #why .bar i { display: block; height: 100%; border-radius: 2px; background: #b45309; }
  #why .verdict { margin-top: 8px; font-weight: 600; }
  #why .close { cursor: pointer; color: var(--faint); }
  #credits { right: 24px; bottom: 8px; color: var(--faint); font-size: 11px; pointer-events: none; }
  #status { left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); text-align: center; }
  #status a { color: var(--ink); font-weight: 600; }
  #tip { position: fixed; display: none; max-width: 280px; background: #151a23; color: #fff; font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 8px; pointer-events: none; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .q { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #e5e7eb; color: var(--muted); font-size: 10px; font-weight: 600; font-style: normal; cursor: help; margin-left: 4px; }
  .lbl { position: absolute; font-size: 11px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,.85); padding: 1px 5px; border-radius: 4px; transform: translate(-50%, -180%); white-space: nowrap; pointer-events: none; }
  .lbl.hot { background: var(--ink); color: #fff; }
  @media (max-width: 760px) { #cards, #why, #left .card { display: none !important; } #title h1 { font-size: 28px; } #title { left: 16px; } #left { left: 4px; top: auto; } }
</style>
</head>
<body>
<div id="title" class="ui"><h1></h1><div class="sub"></div><div class="sub2"></div><a id="plan" href="../planner/">Plan a new scenario</a></div>
<div id="left" class="ui">
  <details class="card" id="layers" open>
    <summary>Layers</summary>
    <div class="pair"><select id="o-path" aria-label="Path"><option value="full">Full path</option><option value="flown">Flown so far</option><option value="trail">Last minute</option><option value="off">No path</option></select><select id="o-color" aria-label="Path colour"><option value="drone">Drone colours</option><option value="certainty">Certainty colours</option></select></div>
    <div class="keys" id="cert-keys" hidden><span><i style="background:var(--located)"></i>Located</span><span><i style="background:var(--heard)"></i>Heard by one only</span><span><i style="background:var(--unseen)"></i>Unseen</span></div>
    <div class="checks">
      <label data-tip="A band around the path, as wide as the position error of each fix (up to 500 m each side). Narrow and solid means the receivers pinned the drone down; wide and faint means they barely did."><input type="checkbox" id="o-ribbon" checked>Error band</label>
      <label><input type="checkbox" id="o-labels" checked>Labels</label>
      <label><input type="checkbox" id="o-drops" checked>Heights</label>
      <label><input type="checkbox" id="o-bearings" checked>Bearings</label>
      <label><input type="checkbox" id="o-fixes" checked>Fixes</label>
      <label><input type="checkbox" id="o-receivers" checked>Receivers</label>
    </div>
    <label class="opt">Drone size <input type="range" id="o-size" min="24" max="140" value="44"></label>
  </details>
  <details class="card" id="heat" open>
    <summary>Coverage heatmap</summary>
    <div id="heat-body">
      <div class="seg" id="h-metric"><button data-v="off" class="on">Off</button><button data-v="located" data-tip="Chance that at least two receivers hear a drone here, so its position can be fixed from crossed bearings.">Located</button><button data-v="heard" data-tip="Chance that at least one receiver hears a drone here.">Heard</button><button data-v="err" data-tip="Expected position error of a fix here. Darker means more precise.">Error</button></div>
      <div class="opt"><span id="h-alt-l">Height</span><input type="range" id="h-alt" min="0" max="0" step="1" value="0" aria-label="Height above ground"><label class="inline" data-tip="Show every height at once, as a cloud of points."><input type="checkbox" id="h-3d">3D</label></div>
      <label class="opt">Radio <select id="h-em"></select></label>
      <div id="h-ramp"></div>
      <div class="ramp-l"><span id="h-lo"></span><span id="h-what"></span><span id="h-hi"></span></div>
    </div>
    <div class="hint" id="heat-none" hidden>This run has no coverage data. Run the scenario again.</div>
  </details>
  <div id="legend">
    <span class="pill">Real terrain</span>
    <h2 id="gname">Satellite</h2>
    <div class="src">Elevation: Copernicus GLO-30 · ESA</div>
    <div id="ramp"></div>
    <div class="ramp-l"><span id="zmin"></span><span id="vex"></span><span id="zmax"></span></div>
    <div>
      <div class="seg" id="ground"><button data-v="sat" class="on">Satellite</button><button data-v="map">Map</button><button data-v="elev">Elevation</button></div>
      <div class="seg" id="show"><button data-v="truth" data-tip="Show where the drones really were.">Truth</button><button data-v="sensed" data-tip="Show what the receivers measured. A coloured line from a receiver is a measured bearing. A circle is a position from crossed bearings.">Sensed</button><button data-v="both" class="on" data-tip="Show the truth and the measurements together.">Both</button></div>
    </div>
  </div>
</div>
<div id="cards" class="ui"></div>
<div id="why" class="ui card"></div>
<div id="bar" class="ui">
  <button id="play" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" value="0" step="0.01" aria-label="Time">
  <span id="clock"></span>
  <select id="speed" aria-label="Speed"><option value="1">1×</option><option value="10" selected>10×</option><option value="30">30×</option><option value="60">60×</option></select>
</div>
<div id="credits" class="ui"></div>
<div id="status" class="ui">Loading the scenario…</div>
<div id="labels"></div>
<div id="tip" role="tooltip"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const VEX = 4;  // vertical exaggeration
const AIRFRAME = /grey|foam/;  // painted model parts take the drone's colour; black, glass and metal parts stay
// categorical palette, fixed order; drones past the 8th are grey and carry identity by label only
const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
const STATUS = { located: '#0ca30c', heard: '#fab219', none: '#898781' };
const STATUS_TEXT = { located: 'located', heard: 'heard', none: 'unseen' };
const HEAT_RAMP = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281', '#0d366b'];
const PROP_SPIN = 40;  // rad/s while playing; real props are far faster, this reads as "spinning"
const $ = s => document.querySelector(s);
const res = await fetch('../out/bundle.json', { cache: 'no-store' }).catch(() => null);
if (!res?.ok) {
  $('#status').innerHTML = 'No simulation yet. <a href="../planner/">Plan a scenario</a> or run <code>sim.py</code>.';
  throw new Error('out/bundle.json missing');
}
const B = await res.json();
const S = B.scenario, T = B.terrain, F = B.frame, N = B.t.length;
const objIds = Object.keys(B.truth);
const color = id => PALETTE[objIds.indexOf(id)] ?? '#898781';
const opt = { path: 'full', colorBy: 'drone', ribbon: true, labels: true, drops: true, bearings: true, fixes: true, receivers: true, size: 44 };

// ---- terrain grid helpers (local metres: x east, y north) ----
const zs = T.z, zmin = Math.min(...zs), zmax = Math.max(...zs);
const base = zmin - (zmax - zmin) * 0.35;
const toScene = (x, y, z) => new THREE.Vector3(x / 1000, (z - base) * VEX / 1000, -y / 1000);
function groundH(x, y) {
  const c = Math.min(Math.max((x - T.x0) / T.dx, 0), T.nx - 1.001), r = Math.min(Math.max((T.y0 - y) / T.dy, 0), T.ny - 1.001);
  const c0 = c | 0, r0 = r | 0, fc = c - c0, fr = r - r0, z = (i, j) => zs[i * T.nx + j];
  return (z(r0, c0) * (1 - fc) + z(r0, c0 + 1) * fc) * (1 - fr) + (z(r0 + 1, c0) * (1 - fc) + z(r0 + 1, c0 + 1) * fc) * fr;
}
const latlon = (x, y) => [F.lat0 + y / F.my, F.lon0 + x / F.mx];

// ---- scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#eef0f4');
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 500);
camera.position.set(-4, 14, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
scene.add(new THREE.HemisphereLight('#ffffff', '#b8b2a0', 1.6));
const sun = new THREE.DirectionalLight('#fff7ea', 2.2);
sun.position.set(-12, 16, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// terrain surface
const pos = [], uvMerc = [], cols = [], idx = [];
const ramp = [[0, '#4f6b2f'], [0.35, '#8a8f45'], [0.7, '#c9b97a'], [1, '#ece2bd']].map(([k, c]) => [k, new THREE.Color(c)]);
const rampAt = k => { for (let i = 1; i < ramp.length; i++) if (k <= ramp[i][0]) return ramp[i - 1][1].clone().lerp(ramp[i][1], (k - ramp[i - 1][0]) / (ramp[i][0] - ramp[i - 1][0])); return ramp.at(-1)[1]; };
for (let i = 0; i < T.ny; i++) for (let j = 0; j < T.nx; j++) {
  const x = T.x0 + j * T.dx, y = T.y0 - i * T.dy, z = zs[i * T.nx + j];
  pos.push(...toScene(x, y, z).toArray());
  uvMerc.push(latlon(x, y));
  cols.push(...rampAt((z - zmin) / (zmax - zmin)).toArray());
}
for (let i = 0; i < T.ny - 1; i++) for (let j = 0; j < T.nx - 1; j++) {
  const a = i * T.nx + j, b = a + 1, c = a + T.nx, d = c + 1;
  idx.push(a, c, b, b, c, d);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(uvMerc.length * 2), 2));
geo.setIndex(idx);
geo.computeVertexNormals();
const terrainMat = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 });
const terrain = new THREE.Mesh(geo, terrainMat);
terrain.castShadow = terrain.receiveShadow = true;
scene.add(terrain);

// side walls: one strip per edge from the surface down to the base
const wall = [], wallIdx = [];
const edges = [
  [...Array(T.nx).keys()].map(j => [0, j]), [...Array(T.nx).keys()].map(j => [T.ny - 1, j]),
  [...Array(T.ny).keys()].map(i => [i, 0]), [...Array(T.ny).keys()].map(i => [i, T.nx - 1]),
];
for (const e of edges) {
  const o = wall.length / 3;
  e.forEach(([i, j], k) => {
    const x = T.x0 + j * T.dx, y = T.y0 - i * T.dy;
    wall.push(...toScene(x, y, zs[i * T.nx + j]).toArray(), ...toScene(x, y, base).toArray());
    if (k) wallIdx.push(o + 2 * k - 2, o + 2 * k - 1, o + 2 * k, o + 2 * k, o + 2 * k - 1, o + 2 * k + 1);
  });
}
const wallGeo = new THREE.BufferGeometry();
wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wall, 3));
wallGeo.setIndex(wallIdx);
wallGeo.computeVertexNormals();
const walls = new THREE.Mesh(wallGeo, new THREE.MeshStandardMaterial({ color: '#b9a77c', roughness: 1, side: THREE.DoubleSide }));
walls.castShadow = true;
scene.add(walls);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

// ---- ground texture: stitched web-mercator tiles ----
const GROUND = {
  sat: { url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
         credit: 'Imagery: Esri, Maxar, Earthstar Geographics' },
  map: { url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${z}/${y}/${x}`,
         credit: 'Map: Esri World Topographic Map, © OpenStreetMap contributors and others' },
};
const merc = (lat, lon, z) => { const n = 256 * 2 ** z, s = Math.sin(lat * Math.PI / 180); return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n]; };
const [W, Sth, E, Nth] = S.bbox, maxPx = Math.min(renderer.capabilities.maxTextureSize, 8192);
let tz = 17, tx0, ty0, tx1, ty1;
for (; tz > 8; tz--) {
  [tx0, ty0] = merc(Nth, W, tz).map(v => Math.floor(v / 256)); [tx1, ty1] = merc(Sth, E, tz).map(v => Math.floor(v / 256));
  if ((tx1 - tx0 + 1) * 256 <= maxPx && (ty1 - ty0 + 1) * 256 <= maxPx) break;
}
const cw = (tx1 - tx0 + 1) * 256, ch = (ty1 - ty0 + 1) * 256, uv = geo.attributes.uv;
uvMerc.forEach(([lat, lon], k) => { const [px, py] = merc(lat, lon, tz); uv.setXY(k, (px - tx0 * 256) / cw, 1 - (py - ty0 * 256) / ch); });
const textures = {};
async function groundTexture(kind) {
  if (textures[kind]) return textures[kind];
  const cv = Object.assign(document.createElement('canvas'), { width: cw, height: ch }), g = cv.getContext('2d');
  const jobs = [];
  for (let x = tx0; x <= tx1; x++) for (let y = ty0; y <= ty1; y++) jobs.push(new Promise(ok => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => { g.drawImage(im, (x - tx0) * 256, (y - ty0) * 256); ok(); };
    im.onerror = ok;  // a missing tile stays blank
    im.src = GROUND[kind].url(tz, x, y);
  }));
  await Promise.all(jobs);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return (textures[kind] = tex);
}
async function setGround(kind) {
  $('#gname').textContent = { sat: 'Satellite', map: 'Map', elev: 'Elevation' }[kind];
  $('#credits').textContent = `Terrain: Copernicus GLO-30 · ${GROUND[kind]?.credit ?? 'Elevation tint'} · vertical ×${VEX}`;
  if (kind === 'elev') { Object.assign(terrainMat, { map: null, vertexColors: true }); terrainMat.needsUpdate = true; return; }
  $('#status').textContent = 'Loading the ground image…';
  const tex = await groundTexture(kind);
  $('#status').textContent = '';
  Object.assign(terrainMat, { map: tex, vertexColors: false });
  terrainMat.needsUpdate = true;
}

// ---- sensors, drones, paths, bearings, fixes ----
const truthGroup = new THREE.Group(), sensedGroup = new THREE.Group(), sensorGroup = new THREE.Group();
scene.add(truthGroup, sensedGroup, sensorGroup);
const labels = [];
const label = (text, obj) => { const el = Object.assign(document.createElement('div'), { className: 'lbl', textContent: text }); $('#labels').append(el); labels.push([el, obj]); return el; };
const fatMats = [];
function fatLine(pts, color, width, opacity) {

// what the receivers got for each drone, each second: located (fix), heard by one, or nothing
const fixAt = {}, status = {};

  fixAt[id] = new Map(B.fused[id].map(f => [f[0], f]));
  status[id] = B.t.map((tt, i) => fixAt[id].has(tt) ? 'located' : B.sensors.some(s => B.links[`${s.id}|${id}`].det[i]) ? 'heard' : 'none');
}
const STATUS_RGB = Object.fromEntries(Object.entries(STATUS).map(([k, c]) => [k, new THREE.Color(c).toArray()]));

// error band: a flat ribbon along the path, as wide as each fix's position error (ce), fading as

const BAND_MAX_M = 500, ERR_BEST = 50, ERR_WORST = 2000;  // m

function errorBand(id) {

  for (let i = 0; i < N; i++) {
    const a = Math.max(i - 1, 0), b = Math.min(i + 1, N - 1), dx = tr.x[b] - tr.x[a], dy = tr.y[b] - tr.y[a], len = Math.hypot(dx, dy) || 1;
    const ce = fixAt[id].get(B.t[i])?.[3] ?? 0, w = Math.min(ce, BAND_MAX_M), ox = -dy / len * w, oy = dx / len * w;
    p.push(...toScene(tr.x[i] + ox, tr.y[i] + oy, tr.z[i]).toArray(), ...toScene(tr.x[i] - ox, tr.y[i] - oy, tr.z[i]).toArray());
    const alpha = ce ? 0.04 + 0.8 * precision(ce) ** 2 : 0;  // poor fixes stay faint so many drones do not clutter
    c.push(...rgb, alpha, ...rgb, alpha);
    start.push(ix.length);
    if (i < N - 1 && ce && fixAt[id].has(B.t[i + 1])) ix.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 2, 2 * i + 1, 2 * i + 3);
  }
  start.push(ix.length);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 4));
  g.setIndex(ix);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }));

}

// ---- hover highlight: glow, bigger, own path forward, the others dimmed ----
let hoverId = null;

    d.mats.forEach(m => m.emissive?.set(on ? color(k) : '#000000').multiplyScalar(on ? 0.55 : 1));
    d.boost = on ? 1.4 : 1;

  const tr = B.truth[id], j = Math.min(i + 1, N - 1), k = j === i ? Math.max(i - 1, 0) : i;
  const dt = (B.t[j] - B.t[k]) || 1;
  return { agl: tr.z[i] - groundH(tr.x[i], tr.y[i]), speed: Math.hypot(tr.x[j] - tr.x[k], tr.y[j] - tr.y[k]) / dt, heading: tr.h?.[i] };
}

  return `${id}: ${B.drones?.[id]?.name ?? 'drone'}. ${Math.round(n.agl)} m above ground, ${n.speed.toFixed(0)} m/s${n.heading != null ? `, heading ${Math.round(n.heading)}°` : ''}. ${what}`;
}

// ---- coverage heatmap: a sheet at one height, or a 3D cloud over all heights ----
const C = B.coverage, heat = { metric: 'off', view: 'slice', alt: 0, em: C?.object_emitter[objIds[0]] };
const rampC = HEAT_RAMP.map(c => new THREE.Color(c));
const rampColor = v => { const f = v * (rampC.length - 1), k = Math.min(Math.floor(f), rampC.length - 2); return rampC[k].clone().lerp(rampC[k + 1], f - k); };
function certainty(e, metric, k) {  // 0..1, darker = more certain; null = nothing to draw
  if (metric === 'err') { const m = e.err[k]; return m < 0 ? null : precision(m); }
  const p = e[metric][k] / 100;
  return p < 0.02 ? null : p;
}
let heatObj = null;
const dotTexture = (() => {  // soft round dot for the 3D cloud

  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.5, 'rgba(255,255,255,.8)'); grad.addColorStop(1, 'rgba(255,255,255,0)');

function drawHeat() {

  const e = C.emitters[heat.em], cells = C.nx * C.ny, p = [], c = [], ix = [];
  const cell = (a, r, q) => { const x = C.x0 + q * C.dx, y = C.y0 - r * C.dy; return [x, y, toScene(x, y, groundH(x, y) + C.alts[a])]; };

    for (let r = 0; r < C.ny; r++) for (let q = 0; q < C.nx; q++) {
      const v = certainty(e, heat.metric, heat.alt * cells + r * C.nx + q);
      p.push(...cell(heat.alt, r, q)[2].toArray());
      c.push(...rampColor(v ?? 0).toArray(), v == null ? 0 : 0.35 + 0.45 * v);
    }
    for (let r = 0; r < C.ny - 1; r++) for (let q = 0; q < C.nx - 1; q++) {
      const a = r * C.nx + q;
      ix.push(a, a + C.nx, a + 1, a + 1, a + C.nx, a + C.nx + 1);
    }

    for (let a = 0; a < C.alts.length; a++) for (let r = 0; r < C.ny; r++) for (let q = 0; q < C.nx; q++) {

}

// ---- cards: drones now, then one per receiver ----
const fmtT = t => new Date(Date.parse(S.start_utc) + t * 1000).toISOString().slice(11, 19);
const droneCard = Object.assign(document.createElement('div'), { className: 'card' });
droneCard.innerHTML = `<h3>Drones<span>now<i class="q" data-tip="Height above ground and what the receivers make of each drone right now. Hover a row to highlight that drone; hover the drone itself for speed and heading.">?</i></span></h3>` +
  objIds.map(id => `<div class="row drow" data-id="${id}"><i class="dot" style="background:${color(id)}"></i>${id}<span class="v"></span></div>`).join('');

droneCard.querySelectorAll('.drow').forEach(r => { r.onmouseenter = () => setHover(r.dataset.id); r.onmouseleave = () => setHover(null); });
const PMIN = -130, PMAX = -50, SW = 244, SH = 48;

let selected = null;
for (const s of B.sensors) {

function whyCard(k, i) {

// ---- time + view state ----
let t = 0, playing = false, show = 'both', lastI = -1;
$('#seek').max = N - 1;
function update(force) {
  const i = Math.min(Math.floor(t), N - 1), f = t - i, j = Math.min(i + 1, N - 1);
  for (const id of objIds) {
    const tr = B.truth[id], lerp = a => a[i] + (a[j] - a[i]) * f, d = drones[id];
    const x = lerp(tr.x), y = lerp(tr.y);
    d.m.position.copy(toScene(x, y, lerp(tr.z)));
    if (tr.h) {  // heading clockwise from north (shortest way round), pitch nose up, roll right side down
      const hd = tr.h[i] + ((((tr.h[j] - tr.h[i]) % 360) + 540) % 360 - 180) * f, rad = Math.PI / 180;
      d.m.rotation.set(lerp(tr.p) * rad, -hd * rad, -lerp(tr.r) * rad, 'YXZ');
    }
    d.drop.visible = opt.drops;
    if (opt.drops) d.drop.geometry.setFromPoints([d.m.position, toScene(x, y, groundH(x, y))]);
  }
  if (i === lastI && !force) return;
  lastI = i;
  drawPaths(i, false);
  for (const k in bearings) {
    const { l, s } = bearings[k], L = B.links[k];
    l.visible = opt.bearings && !!L.det[i];
    if (!l.visible) continue;
    // stop the line at the edge of the block
    const b = L.bearing[i] * Math.PI / 180, ux = Math.sin(b), uy = Math.cos(b);
    const x1 = T.x0 + (T.nx - 1) * T.dx, y1 = T.y0 - (T.ny - 1) * T.dy;
    const len = Math.min(ux > 0 ? (x1 - s.x) / ux : ux < 0 ? (T.x0 - s.x) / ux : Infinity,
                         uy > 0 ? (T.y0 - s.y) / uy : uy < 0 ? (y1 - s.y) / uy : Infinity) / 1000;
    l.geometry.setFromPoints([s.top, s.top.clone().add(new THREE.Vector3(Math.sin(b) * len, 0, -Math.cos(b) * len))]);
  }
  for (const id of objIds) {
    const fx = fixAt[id].get(B.t[i]), ring = rings[id];
    ring.visible = opt.fixes && !!fx;
    if (!fx) continue;
    ring.position.copy(toScene(fx[1], fx[2], groundH(fx[1], fx[2]) + 30));
    ring.scale.setScalar(Math.max(fx[3], 60) / 1000);
  }
  droneCard.querySelectorAll('.drow').forEach(r => {
    const id = r.dataset.id, n = droneNow(id, i), st = status[id][i];
    r.querySelector('.v').innerHTML = `${Math.round(n.agl)} m · <span class="st"><i style="background:${STATUS[st]}"></i>${STATUS_TEXT[st]}</span>`;
  });
  document.querySelectorAll('.card svg .cur').forEach(c => { const x = i / (N - 1) * SW; c.setAttribute('x1', x); c.setAttribute('x2', x); });
  document.querySelectorAll('.row[data-k]').forEach(r => {
    const L = B.links[r.dataset.k], v = r.querySelector('.v');
    v.textContent = L.det[i] ? `${L.power[i].toFixed(0)} dBm · ${L.bearing[i].toFixed(0)}°` : 'no signal';
    v.classList.toggle('off', !L.det[i]);
    r.classList.toggle('sel', r.dataset.k === selected);
  });
  $('#why').style.display = selected ? 'block' : 'none';
  if (selected) $('#why').innerHTML = whyCard(selected, i);
  $('#seek').value = t;
  $('#clock').textContent = `${fmtT(B.t[i])} UTC`;
}
function setShow(v) { show = v; truthGroup.visible = v !== 'sensed'; sensedGroup.visible = v !== 'truth'; }
function segment(sel, fn) {
  document.querySelectorAll(`${sel} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`${sel} button`).forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v);
  });
}
segment('#ground', setGround);
segment('#show', setShow);
segment('#h-metric', v => { heat.metric = v; heatLegend(); drawHeat(); });
$('#h-3d').onchange = e => { heat.view = e.target.checked ? 'cloud' : 'slice'; heatLegend(); drawHeat(); };
$('#o-path').onchange = e => { opt.path = e.target.value; drawPaths(lastI, true); };
$('#o-color').onchange = e => { opt.colorBy = e.target.value; $('#cert-keys').hidden = opt.colorBy !== 'certainty'; drawPaths(lastI, true); };
for (const k of ['ribbon', 'labels', 'drops', 'bearings', 'fixes', 'receivers']) $(`#o-${k}`).onchange = e => { opt[k] = e.target.checked; sensorGroup.visible = opt.receivers; update(true); };
$('#o-size').oninput = e => { opt.size = +e.target.value; };
$('#play').onclick = () => { playing = !playing; $('#play').textContent = playing ? '❚❚' : '▶'; $('#play').ariaLabel = playing ? 'Pause' : 'Play'; };
$('#seek').oninput = e => { t = +e.target.value; update(true); };
addEventListener('keydown', e => { if (e.code === 'Space' && !e.target.closest('input, select')) { e.preventDefault(); $('#play').click(); } });

// ---- header + legend ----
$('#title h1').textContent = S.name;
$('#title .sub').textContent = `${S.region ?? ''} · ${S.sensors.length} receivers · ${objIds.length} drones · ${Math.round(S.duration_s / 60)} min`.replace(/^ · /, '');
$('#title .sub2').textContent = `seed ${S.seed} · real terrain · starts ${S.start_utc.replace('T', ' ').replace('Z', ' UTC')}`;
$('#zmin').textContent = `${Math.round(zmin)} m`;
$('#zmax').textContent = `${Math.round(zmax)} m`;
$('#vex').textContent = `vertical ×${VEX}`;

// ---- loop ----
const ctr = toScene(0, 0, zmin);
controls.target.copy(ctr);
const v = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) {
    t += dt * +$('#speed').value;
    if (t >= N - 1) { t = N - 1; $('#play').click(); }
    update();
    for (const id of objIds) for (const [p, axis] of drones[id].props) p.rotateOnAxis(axis, PROP_SPIN * dt);
  }
  controls.update();
  const px = 2 * Math.tan(camera.fov * Math.PI / 360) / innerHeight;  // world size of one pixel at distance 1
  for (const id of objIds) { const d = drones[id]; d.m.scale.setScalar(camera.position.distanceTo(d.m.position) * px * opt.size * d.boost); }
  renderer.render(scene, camera);
  for (const [el, obj] of labels) {
    v.setFromMatrixPosition(obj.matrixWorld).project(camera);
    let hidden = !opt.labels || v.z > 1;
    for (let o = obj.parent; o && !hidden; o = o.parent) hidden = !o.visible;
    el.style.display = hidden ? 'none' : '';
    el.style.left = `${(v.x + 1) / 2 * innerWidth}px`;
    el.style.top = `${(1 - v.y) / 2 * innerHeight}px`;
  }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); fatMats.forEach(m => m.resolution.set(innerWidth, innerHeight)); });

// ---- tooltips: HTML elements with data-tip, and 3D objects with userData.tip; drones highlight on hover ----
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
function pick3D(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(hoverables.filter(shown), false)[0]?.object;
}
addEventListener('pointermove', e => {
  const onCanvas = e.target === renderer.domElement, hit = onCanvas ? pick3D(e) : null;
  if (onCanvas) setHover(hit?.userData.droneId ?? null);
  const tip = $('#tip'), text = e.target.closest?.('[data-tip]')?.dataset.tip ?? hit?.userData.tip?.();
  tip.style.display = text ? 'block' : 'none';
  if (!text) return;
  tip.textContent = text;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${e.clientX + 14 + w > innerWidth ? e.clientX - 14 - w : e.clientX + 14}px`;
  tip.style.top = `${e.clientY + 14 + h > innerHeight ? e.clientY - 14 - h : e.clientY + 14}px`;
});
// deep link to one moment: ?t=<seconds>&ground=sat|map|elev&show=truth|sensed|both&sel=RF1|drone_01&heat=located|heard|err
const q = new URLSearchParams(location.search);
t = Math.min(+(q.get('t') ?? 0), N - 1);
selected = q.get('sel');
document.querySelector(`#show [data-v="${q.get('show') ?? 'both'}"]`)?.click();
if (C && q.get('heat')) document.querySelector(`#h-metric [data-v="${q.get('heat')}"]`)?.click();
$('#status').textContent = '';
document.querySelector(`#ground [data-v="${q.get('ground') ?? 'sat'}"]`)?.click();
drawPaths(Math.floor(t), true);
update(true);
</script>
</body>
</html>
