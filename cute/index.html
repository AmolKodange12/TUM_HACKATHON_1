<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Spotters</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cellipse cx='19' cy='24' rx='13' ry='10.5' fill='%23ff8fa3'/%3E%3Ccircle cx='26' cy='16' r='8' fill='%23ff6b81'/%3E%3Ccircle cx='28' cy='14.6' r='2.6' fill='%232a2140'/%3E%3Cpath d='M33.6 16.2l6 2-6 2z' fill='%23ffb347'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f5c; --soft: #7a6f99; --faint: #b3abcc; --card: #ffffff; --ledge: rgba(59, 47, 92, .13);
    --coral: #ff6b81; --coral-d: #e2475f; --sun: #ffc23c; --sun-d: #e89a00; --mint: #3ddc97; --mint-d: #1fae74;
    --sky: #4fb8ff; --sky-d: #228fe0; --lilac: #a98bff; --lilac-d: #7f5fe8;
    --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 500 15px/1.3 Fredoka, system-ui, sans-serif;
    background: linear-gradient(180deg, #74cbff 0%, #b5e4ff 42%, #ffeccc 100%); user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; outline: none; }
  button, a { font: inherit; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > *, .panel, .panel * { pointer-events: auto; }
  .card { background: var(--card); border-radius: 22px; box-shadow: 0 6px 0 var(--ledge), 0 14px 34px rgba(59, 47, 92, .12); }

  /* chunky springy buttons */
  .btn { --c: var(--sky); --cd: var(--sky-d); border: 0; color: #fff; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 16px;
    cursor: pointer; background: var(--c); box-shadow: 0 5px 0 var(--cd), 0 9px 18px rgba(59, 47, 92, .16); text-decoration: none;
    display: inline-flex; align-items: center; gap: 7px; transform: translateY(0) scale(1); text-shadow: 0 1px 0 rgba(0, 0, 0, .12);
    transition: transform .32s var(--spring), box-shadow .18s var(--out), filter .2s; will-change: transform; }
  .btn:hover { transform: translateY(-2px) scale(1.05); filter: brightness(1.06); }
  .btn:active, .btn.press { transform: translateY(4px) scale(.95); box-shadow: 0 1px 0 var(--cd), 0 3px 8px rgba(59, 47, 92, .16); transition-duration: .07s; }
  .btn:focus-visible, #scrub:focus-visible, .bird:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn svg { width: 18px; height: 18px; }
  .coral { --c: var(--coral); --cd: var(--coral-d); } .sun { --c: var(--sun); --cd: var(--sun-d); color: #5a3d00; text-shadow: none; }
  .mint { --c: var(--mint); --cd: var(--mint-d); } .lilac { --c: var(--lilac); --cd: var(--lilac-d); }
  .ghost { --c: #f1edff; --cd: #d8d0f5; color: var(--ink); text-shadow: none; }

  #title { position: fixed; top: 16px; left: 16px; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; }
  #title .logo { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(160deg, #ffe08a, #ffb86b); display: grid; place-items: center;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .08); animation: bob 2.6s ease-in-out infinite; }
  #title .logo svg { width: 40px; height: 40px; }
  #title h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .3px; line-height: 1; }
  #title h1 span { color: var(--coral); }
  #title p { margin: 4px 0 0; color: var(--soft); font-size: 13px; }

  #top { position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; }
  #roster { position: fixed; top: 88px; right: 16px; width: 290px; max-height: calc(100% - 210px); overflow-y: auto; padding: 14px; scrollbar-width: none; }
  #watchers { position: fixed; left: 16px; bottom: 118px; width: 280px; padding: 14px; }
  .panel h2 { margin: 0 4px 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-transform: uppercase; letter-spacing: 1.2px; display: flex; justify-content: space-between; }
  .panel h2 b { color: var(--ink); font-weight: 700; letter-spacing: 0; text-transform: none; font-size: 15px; }

  .bird { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: #faf8ff; border-radius: 16px; padding: 8px 10px; margin-bottom: 8px;
    cursor: pointer; text-align: left; color: var(--ink); box-shadow: 0 3px 0 rgba(59, 47, 92, .07); transform: scale(1);
    transition: transform .3s var(--spring), background .2s, box-shadow .2s; }
  .bird:hover, .bird.hl { transform: scale(1.03) translateX(-3px); background: #fff; box-shadow: 0 4px 0 var(--id), 0 8px 16px rgba(59, 47, 92, .12); }
  .bird.follow { background: color-mix(in srgb, var(--id) 14%, #fff); }
  .bird .av { width: 44px; height: 44px; flex: none; border-radius: 50%; background: color-mix(in srgb, var(--id) 22%, #fff); border: 3px solid var(--id); display: grid; place-items: center; }
  .bird .av svg { width: 34px; height: 34px; }
  .bird .nm { font-weight: 600; font-size: 15px; } .bird .cl { color: var(--soft); font-size: 12px; }
  .bird .meta { flex: 1; min-width: 0; } .bird .meta > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-block; margin-top: 3px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: #eeebf7; color: var(--soft); transition: background .25s, color .25s, transform .3s var(--spring); }
  .chip.heard { background: #fff1c7; color: #8a5a00; } .chip.spotted { background: #d3f8e6; color: #0f7a4d; }
  .chip.bump { animation: bump .45s var(--spring); }

  .hut { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
  .hut .ic { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--hc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .1); }
  .hut .ic svg { width: 22px; height: 22px; }
  .hut .nm { font-weight: 600; } .hut .sub { color: var(--soft); font-size: 12px; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 2px; vertical-align: -1px; box-shadow: 0 0 0 1.5px #fff; }
  #roster.compact .bird .cl:not(.live) { display: none; } #roster.compact .bird { padding: 6px 10px; margin-bottom: 6px; } #roster.compact .bird .av { width: 38px; height: 38px; }
  .hut .n { margin-left: auto; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  #score { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #d3f8e6, #e6fff3); border-radius: 16px; padding: 8px 12px; margin-bottom: 8px; }
  #score .big { font-size: 30px; font-weight: 700; color: #0f7a4d; font-variant-numeric: tabular-nums; line-height: 1; }
  #score .big.bump { animation: bump .5s var(--spring); }
  #score small { color: #2d8f63; font-size: 12px; display: block; }

  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(880px, calc(100% - 32px)); display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  #play { width: 64px; height: 64px; border-radius: 22px; padding: 0; justify-content: center; flex: none; }
  #play svg { width: 28px; height: 28px; }
  #play.nudge { animation: nudge 1.6s ease-in-out infinite; }
  #clockwrap { flex: none; text-align: center; min-width: 92px; }
  #clock { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #clockwrap small { color: var(--soft); font-size: 12px; display: block; }
  #speeds { display: flex; gap: 6px; flex: none; }
  #speeds .btn { padding: 7px 10px; font-size: 14px; border-radius: 12px; }
  #speeds .btn.on { --c: var(--lilac); --cd: var(--lilac-d); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .12); }

  /* the scrubber: big track, spotted-moment lanes, squishy thumb, floating time bubble */
  #scrub { position: relative; flex: 1; height: 44px; cursor: pointer; touch-action: none; border-radius: 16px; }
  #track { position: absolute; left: 0; right: 0; top: 10px; height: 24px; border-radius: 12px; background: #efeaff; overflow: hidden; box-shadow: inset 0 3px 0 rgba(59, 47, 92, .08); }
  #strip { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; transform: scaleX(0); will-change: transform; background: linear-gradient(90deg, rgba(169, 139, 255, .28), rgba(255, 107, 129, .28)); }
  #thumb { position: absolute; top: 2px; left: 0; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 4px 0 var(--ledge), 0 6px 14px rgba(59, 47, 92, .22); transform: translateX(0) scale(1); will-change: transform; }
  #thumbicon svg { width: 30px; height: 30px; transition: transform .3s var(--spring); }
  #scrub.drag #thumbicon svg { transform: scale(1.22) rotate(-8deg); }
  #thumbicon { display: grid; place-items: center; }
  #thumb .bubble { left: 50%; bottom: 48px; }
  .bubble { position: absolute; bottom: 50px; left: 0; padding: 4px 10px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;
    transform: translateX(-50%) scale(.6); opacity: 0; transition: opacity .15s, transform .3s var(--spring); pointer-events: none; font-variant-numeric: tabular-nums; }
  .bubble.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #ghost { background: rgba(59, 47, 92, .75); }

  /* world-anchored labels: outer moves (transform only), inner animates */
  #labels > div { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
  .tag { transform: translate(-50%, -100%); padding: 3px 9px; border-radius: 99px; background: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; border: 2px solid var(--id);
    box-shadow: 0 3px 0 rgba(59, 47, 92, .12); transition: transform .3s var(--spring); }
  .tag.big { transform: translate(-50%, -100%) scale(1.18); }
  .sign { transform: translate(-50%, -100%); padding: 2px 8px; border-radius: 8px; background: #fff7e0; border: 2px solid #c98b5a; font-size: 12px; font-weight: 700; color: #8a5a3b; }
  .say { position: absolute; transform: translate(-50%, -100%) scale(.2); opacity: 0; padding: 6px 11px; border-radius: 14px; background: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 4px 0 var(--ledge), 0 8px 16px rgba(59, 47, 92, .15); transition: opacity .2s, transform .45s var(--spring); }
  .say::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .say.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .say.spot { background: #3ddc97; color: #fff; font-size: 15px; text-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
  .say.spot::after { border-top-color: #3ddc97; }

  #hint { pointer-events: none !important; position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); padding: 8px 14px; border-radius: 99px; background: rgba(255, 255, 255, .9); color: var(--soft); font-size: 13px;
    transition: opacity .6s; box-shadow: 0 4px 0 var(--ledge); white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #74cbff, #ffeccc); z-index: 5; transition: opacity .6s var(--out); }
  #loading .card { padding: 22px 30px; text-align: center; font-size: 18px; font-weight: 600; }
  #loading .dots span { display: inline-block; width: 12px; height: 12px; margin: 10px 4px 0; border-radius: 50%; background: var(--coral); animation: hop 1s var(--spring) infinite; }
  #loading .dots span:nth-child(2) { background: var(--sun); animation-delay: .12s; } #loading .dots span:nth-child(3) { background: var(--mint); animation-delay: .24s; }

  .enter { animation: enter .7s var(--spring) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(24px) scale(.9); } }
  #bar.enter { animation-name: enterbar; } @keyframes enterbar { from { opacity: 0; transform: translate(-50%, 40px) scale(.9); } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
  @keyframes bump { 40% { transform: scale(1.25); } }
  @keyframes hop { 50% { transform: translateY(-10px); } }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  @media (max-width: 760px) {
    #title { top: 10px; left: 10px; padding: 6px 12px 6px 6px; } #title .logo { width: 40px; height: 40px; } #title .logo svg { width: 30px; height: 30px; }
    #title h1 { font-size: 20px; } #title p { font-size: 11px; }
    #top { top: auto; bottom: 168px; right: 10px; flex-direction: column; } #top .btn { padding: 9px; } #top .btn .lbl { display: none; }
    #roster { top: 74px; left: 10px; right: 10px; width: auto; max-height: none; padding: 8px; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; }
    #roster h2 { display: none; } #birds { display: flex; gap: 8px; } .bird { flex: none; width: auto; margin: 0; padding: 6px 10px 6px 6px; } .bird .cl { display: none; } .bird .av { width: 36px; height: 36px; }
    #watchers { display: none; }
    #bar { bottom: 10px; width: calc(100% - 20px); gap: 10px; padding: 10px; flex-wrap: wrap; }
    #play { width: 52px; height: 52px; } #scrub { order: 3; flex-basis: 100%; } #speeds { margin-left: auto; } #speeds .btn { padding: 6px 8px; font-size: 13px; }
    #clock { font-size: 18px; } #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="loading"><div class="card">Waking up the birds<div class="dots"><span></span><span></span><span></span></div></div></div>
<div class="hud">
  <div id="labels"></div>
  <header id="title" class="card enter">
    <div class="logo" id="logo"></div>
    <div><h1>Sky <span>Spotters</span></h1><p id="sub"></p></div>
  </header>
  <div id="top" class="enter" style="animation-delay:.1s">
    <button id="overview" class="btn ghost" title="Back to the whole board (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="lbl">Overview</span></button>
    <button id="sound" class="btn lilac" aria-pressed="false" title="Sounds (off)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="snd-x" d="M17 9l4 6M21 9l-4 6"/><path id="snd-w" d="M17 8a5 5 0 0 1 0 8" style="display:none"/></svg><span class="lbl">Sound</span></button>
    <a class="btn sun" href="../viewer/" title="The detailed radio view"><span class="lbl">Pro view</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <aside id="roster" class="panel card enter" style="animation-delay:.18s"><h2>Birds <b id="nbirds"></b></h2><div id="birds"></div></aside>
  <aside id="watchers" class="panel card enter" style="animation-delay:.26s">
    <div id="score"><div><div class="big" id="spotted">0</div><small>times spotted so far</small></div></div>
    <h2>Watchers</h2><div id="huts"></div>
  </aside>
  <div id="bar" class="card enter" style="animation-delay:.34s">
    <button id="play" class="btn coral nudge" aria-label="Play"></button>
    <div id="clockwrap"><div id="clock">--:--:--</div><small>UTC</small></div>
    <div id="scrub" role="slider" tabindex="0" aria-label="Time" aria-valuemin="0">
      <div id="track"><canvas id="strip"></canvas><div id="fill"></div></div>
      <div id="thumb"><span id="thumbicon"></span><div class="bubble" id="tbubble"></div></div>
      <div class="bubble" id="ghost"></div>
    </div>
    <div id="speeds"></div>
  </div>
  <div id="hint">Drag to look around · scroll to zoom · click a bird to follow it</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const VEX = 5;           // vertical exaggeration: lumpier, cuter hills (birds use the same mapping, so heights stay true)
const BIRD_PX = 62;      // birds are drawn this many pixels long at any zoom
const ID = ['#ff6b81', '#4fb8ff', '#ffc23c', '#3ddc97', '#a98bff', '#ff9f43', '#22d3ee', '#f472b6'];
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);   // frame-rate independent easing factor
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const ease = { outCubic: k => 1 - (1 - k) ** 3, inOut: k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2,
  outBack: k => { const c = 1.9; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; } };

const birdSVG = (body, head, wing, beak) => `<svg viewBox="0 0 40 40"><ellipse cx="19" cy="24" rx="13" ry="10.5" fill="${body}"/><circle cx="26" cy="16" r="8.2" fill="${head}"/>
  <path d="M7 22q7-9 15 0q-8 5-15 0z" fill="${wing}"/><circle cx="28" cy="14.6" r="2.7" fill="#2a2140"/><circle cx="28.9" cy="13.7" r="1" fill="#fff"/>
  <path d="M33.6 16.2l6 2-6 2z" fill="${beak}"/><circle cx="24" cy="19.6" r="2.2" fill="#ff9fb7" opacity=".85"/></svg>`;
$('#logo').innerHTML = birdSVG('#ff8fa3', '#ff6b81', '#ffd0d8', '#ffb347');

let B;
try { B = await (await fetch('../out/bundle.json', { cache: 'no-store' })).json(); }
catch {
  $('#loading .card').innerHTML = 'No flight data yet 🪺<br><small style="color:var(--soft)">Run <code>sim.py</code>, then reload.</small>';
  throw new Error('no out/bundle.json');
}

// ---------- data ----------
const S = B.scenario, T = B.terrain, N = B.t.length;
const objIds = Object.keys(B.truth);
const objOf = id => S.objects.find(o => o.id === id) ?? {};
const SPECIES = {
  hummingbird: { name: 'Hummingbird', body: '#34d399', belly: '#fff7e6', head: '#22b07d', wing: '#b8f5dc', tip: null, beak: '#3b2f5c', beakLen: .78, beakR: .045,
    span: 1.05, chord: .34, freq: 15, glide: .5, flap: .95, throat: '#ff6b9a', blur: true, size: .82 },
  stork: { name: 'Stork', body: '#ffffff', belly: '#f3f0ff', head: '#ffffff', wing: '#ffffff', tip: '#3b2f5c', beak: '#ff6b5b', beakLen: .72, beakR: .085,
    span: 2.7, chord: .52, freq: 1.5, glide: .04, flap: .55, legs: '#ff6b5b', size: 1 },
  swift: { name: 'Swift', body: '#575ca8', belly: '#fff1d6', head: '#4d5199', wing: '#676cbb', tip: '#3d4180', beak: '#3b2f5c', beakLen: .12, beakR: .07,
    span: 2.4, chord: .3, sweep: .55, freq: 6.5, glide: .05, flap: .6, fork: true, size: .9 },
  pigeon: { name: 'Pigeon', body: '#aaa7cc', belly: '#dcd9f2', head: '#8f8cba', wing: '#c2bfe3', tip: '#77749f', beak: '#ffb86b', beakLen: .2, beakR: .08,
    span: 1.95, chord: .48, freq: 4.4, glide: .14, flap: .7, neck: '#5fd4c4', size: .95 },
};
const SPECIES_OF = { quadcopter: 'hummingbird', fixed_wing_recon: 'stork', delta_wing: 'swift', decoy: 'pigeon' };
const typeOf = id => objOf(id).type ?? (B.drones?.[id]?.model ?? '').split('/').pop().replace('.glb', '');
const speciesOf = id => SPECIES[SPECIES_OF[typeOf(id)]] ?? SPECIES.pigeon;
const idColor = id => ID[objIds.indexOf(id) % ID.length];
const fmtT = t => new Date(Date.parse(S.start_utc) + t * 1000).toISOString().slice(11, 19);

let zmin = Infinity, zmax = -Infinity;
for (const z of T.z) { zmin = Math.min(zmin, z); zmax = Math.max(zmax, z); }
const zr = Math.max(zmax - zmin, 1), base = zmin - zr * 0.22, wl = zmin + zr * 0.035;  // wl: water level
const toScene = (x, y, z) => new THREE.Vector3(x / 1000, (z - base) * VEX / 1000, -y / 1000);
function groundH(x, y) {

    for (const [pv, sx] of b.wings) pv.rotation.z = sx * wingA;
    const sq = Math.sin(b.phase * 2) * amp * .7;
    b.body.scale.set(1 - .03 * sq, 1 + .06 * sq, 1 - .03 * sq);
    b.body.position.y = .05 * s1 * amp;
    b.body.rotation.x = b.sp.blur ? clamp(1 - spd / 6, 0, 1) * .45 : 0;   // hummingbirds sit upright while hovering
    b.tail.rotation.y = .5 + .35 * Math.sin(clock * 11 + b.phase);
    // pop in, hover bounce, screen-constant size
    b.pop = Math.min(b.pop + dt / .7, 1);
    const popK = introT < 1.6 && !REDUCED ? 0 : ease.outBack(clamp(b.pop, 0, 1));
    if (introT < 1.6 && !REDUCED) b.pop = 0;
    const hl = hovered === id || following === id;
    b.hl += ((hl ? 1 : 0) - b.hl) * damp(10, dt);
    b.fk = (b.fk ?? 0) + ((following === id ? 1 : 0) - (b.fk ?? 0)) * damp(4, dt);   // close-up: the followed bird grows
    const dist = camera.position.distanceTo(b.root.position), s = dist * kpx * BIRD_PX / b.norm * b.sp.size * (1 + .3 * b.hl) * (1 + 1.3 * b.fk) * popK;
    b.root.scale.setScalar(Math.max(s, 1e-4));
    b.halo.material.opacity = .85 * b.hl * (.8 + .2 * Math.sin(clock * 5));
    b.ol.color.set(b.hl > .5 ? b.color : INK);
    // blob shadow on the ground: smaller and lighter the higher the bird
    const gy = toScene(x, y, groundH(x, y)).y, agl = b.root.position.y - gy;
    b.shadow.position.set(b.root.position.x, gy + .012, b.root.position.z);
    b.shadow.scale.setScalar(Math.max(s * 1.3 / (1 + agl * .8), 1e-4));
    b.shadow.material.opacity = clamp(.9 - agl * .35, .2, .9) * popK;
    // puffy trail of the last ~30 s
    const P = b.trail.geometry.attributes, c = srgb(b.color);
    for (let k = 0; k < trailN; k++) {
      const tt = Math.max(t - k * 1.1, 0), ii = Math.min(Math.floor(tt), N - 1), jj = Math.min(ii + 1, N - 1), ff = tt - ii;
      const p = toScene(tr.x[ii] + (tr.x[jj] - tr.x[ii]) * ff, tr.y[ii] + (tr.y[jj] - tr.y[ii]) * ff, tr.z[ii] + (tr.z[jj] - tr.z[ii]) * ff);
      P.position.setXYZ(k, p.x, p.y, p.z);
      const fade = 1 - k / trailN;
      P.size.setX(k, k < 2 ? 0 : s * (.18 + .22 * fade) * (1 + .4 * b.hl));
      P.rgba.setXYZW(k, .55 + .45 * c[0], .55 + .45 * c[1], .55 + .45 * c[2], fade * (.55 + .4 * b.hl) * popK);
    }
    P.position.needsUpdate = P.size.needsUpdate = P.rgba.needsUpdate = true;
    // dashed full path while highlighted, marching
    b.path.material.opacity += ((hl ? .95 : 0) - b.path.material.opacity) * damp(8, dt);
    b.path.visible = b.path.material.opacity > .02;
    b.path.material.dashOffset -= dt * .35;
    // the fix ring springs to its size (critically under-damped for a little bounce)
    if (b.ring.visible) {
      b.ring.position.lerp(b.ringPos, damp(6, dt));
      b.ringV += (b.ringTarget - b.ringS) * 160 * dt; b.ringV *= Math.exp(-dt * 11); b.ringS += b.ringV * dt;
      if (b.ringTarget === 0 && b.ringS < .004) { b.ring.visible = false; b.ringS = 0; b.ringV = 0; }
      b.ring.scale.setScalar(Math.max(b.ringS, 1e-4));
      b.ring.position.y = b.ringPos.y + .03;
    }
    if (b.sayUntil && now > b.sayUntil) { b.say.classList.remove('on'); b.sayUntil = 0; }
  }

  // huts: drop in, binoculars turn toward the strongest bearing they measure, beams show each bearing
  for (const s of B.sensors) {
    const h = huts[s.id];
    if (!REDUCED && introT > 1.1) { h.v += (1 - h.pop) * 120 * dt; h.v *= Math.exp(-dt * 9); h.pop += h.v * dt; }
    h.g.scale.setScalar(Math.max(h.pop, 1e-3) * Math.max(1, D / 14));
    const goal = h.target ? -h.target[1].bearing[i] * rad : h.ang + Math.sin(clock * .6 + s.x) * .9;
    h.bino.rotation.y += Math.atan2(Math.sin(goal - h.bino.rotation.y), Math.cos(goal - h.bino.rotation.y)) * damp(h.target ? 7 : 2, dt);
    h.flag.rotation.y = Math.sin(clock * 4 + s.y) * .4;
    for (const oid of objIds) {
      const bm = h.beams[oid];
      if (!bm) continue;
      bm.a += ((bm.on ? .2 : 0) - bm.a) * damp(8, dt);
      bm.m.visible = bm.a > .01; bm.m.material.opacity = bm.a * (.85 + .15 * Math.sin(clock * 9 + oid.length));
      if (bm.on) bm.m.rotation.y += Math.atan2(Math.sin(-bm.bearing * rad - bm.m.rotation.y), Math.cos(-bm.bearing * rad - bm.m.rotation.y)) * damp(9, dt);
    }
    h.shown += (h.goal - h.shown) * damp(8, dt);
    const n = Math.round(h.shown); if (h.n.textContent !== `${n}`) h.n.textContent = n;
    if (h.sayUntil && now > h.sayUntil) { h.say.classList.remove('on'); h.sayUntil = 0; }
  }
  shownSpotted += (spottedGoal - shownSpotted) * damp(8, dt);
  const sv = `${Math.round(shownSpotted)}`; if ($('#spotted').textContent !== sv) $('#spotted').textContent = sv;

  // water shimmer and drifting clouds
  water.position.y = (wl - base) * VEX / 1000 + Math.sin(clock * 1.3) * .004;
  for (const c of clouds) { const u = c.userData; u.a += dt * .012; c.position.set(CX + Math.cos(u.a) * u.r, u.y + Math.sin(clock * .5 + u.a * 3) * .08, CZ + Math.sin(u.a) * u.r * .8); }
  stepParticles(dt);

  renderer.render(scene, camera);

  // HUD follows the world, using transforms only (no layout work)
  const place = (o, p, dy = 0) => { v3.copy(p).project(camera); const vis = v3.z < 1; o.style.display = vis ? '' : 'none'; if (vis) o.style.transform = `translate3d(${((v3.x + 1) / 2 * innerWidth).toFixed(1)}px, ${((1 - v3.y) / 2 * innerHeight - dy).toFixed(1)}px, 0)`; };
  for (const id of objIds) {
    const b = birds[id], ps = BIRD_PX * .55 * (1 + .3 * b.hl) * (1 + 1.3 * (b.fk ?? 0));
    place(b.tagO, b.root.position, ps); b.tag.classList.toggle('big', b.hl > .5);
    place(b.sayO, b.root.position, ps + 30);
    if (b.hl > .5 || following === id) {
      const agl = Math.round((b.root.position.y - toScene(0, 0, groundH(B.truth[id].x[i], B.truth[id].y[i])).y) * 1000 / VEX), kmh = Math.round(Math.hypot(B.truth[id].x[j] - B.truth[id].x[i], B.truth[id].y[j] - B.truth[id].y[i]) * 3.6);
      b.tag.textContent = `${b.sp.name} · ${agl} m up · ${kmh} km/h`;
    } else if (b.tag.textContent !== b.sp.name) b.tag.textContent = b.sp.name;
  }
  for (const s of B.sensors) { const h = huts[s.id]; tmp.copy(h.g.position).y += .62 * h.g.scale.y; place(h.signO, tmp, 4); place(h.sayO, tmp, 30); }
  for (const id of objIds) {
    const b = birds[id], tr = B.truth[id];
    const agl = Math.round(tr.z[i] - groundH(tr.x[i], tr.y[i])), kmh = Math.round(Math.hypot(tr.x[j] - tr.x[i], tr.y[j] - tr.y[i]) * 3.6);
    const txt = `${agl} m up · ${kmh} km/h`; if (b.live.textContent !== txt) b.live.textContent = txt;
  }

  // timeline
  const r = scrub.getBoundingClientRect(), goalX = (t / Math.max(N - 1, 1)) * r.width;
  thumbX = dragging || REDUCED ? goalX : thumbX + (goalX - thumbX) * damp(18, dt);
  thumb.style.transform = `translateX(${thumbX.toFixed(1)}px) scale(${dragging ? 1.12 : 1})`;
  $('#fill').style.transform = `scaleX(${(thumbX / Math.max(r.width, 1)).toFixed(4)})`;
  const tb = $('#tbubble'), tbt = fmtT(B.t[i]); if (tb.textContent !== tbt) tb.textContent = tbt;
  const clk = fmtT(B.t[i]); if ($('#clock').textContent !== clk) { $('#clock').textContent = clk; scrub.setAttribute('aria-valuenow', i); scrub.setAttribute('aria-valuetext', `${clk} UTC`); }
  requestAnimationFrame(frame);
}

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pathMats.forEach(m => m.resolution.set(innerWidth, innerHeight));
  pointsMat.uniforms.scale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(camera.fov * rad / 2));
  drawStrip();
}
addEventListener('resize', resize);
resize();
onSecond(Math.min(Math.floor(t), N - 1), false); lastI = Math.min(Math.floor(t), N - 1);
$('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 650);
setTimeout(() => $('#hint').style.opacity = 0, 9000);
window.__cute = { camera, controls, birds, follow, setHover, get t() { return t; }, set t(v) { t = v; } };  // for screenshots and debugging
requestAnimationFrame(frame);
</script>
</body>
</html>
