<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Spotters</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cellipse cx='19' cy='24' rx='13' ry='10.5' fill='%23ff8fa3'/%3E%3Ccircle cx='26' cy='16' r='8' fill='%23ff6b81'/%3E%3Ccircle cx='28' cy='14.6' r='2.6' fill='%232a2140'/%3E%3Cpath d='M33.6 16.2l6 2-6 2z' fill='%23ffb347'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f5c; --soft: #7a6f99; --faint: #b3abcc; --card: #ffffff; --ledge: rgba(59, 47, 92, .13);
    --coral: #ff6b81; --coral-d: #e2475f; --sun: #ffc23c; --sun-d: #e89a00; --mint: #3ddc97; --mint-d: #1fae74;
    --sky: #4fb8ff; --sky-d: #228fe0; --lilac: #a98bff; --lilac-d: #7f5fe8;
    --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 500 15px/1.3 Fredoka, system-ui, sans-serif;
    background: linear-gradient(180deg, #74cbff 0%, #b5e4ff 42%, #ffeccc 100%); user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; outline: none; }
  button, a { font: inherit; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > *:not(#labels), .hud button, .hud a, .hud .st { pointer-events: auto; }
  .card { background: var(--card); border-radius: 22px; box-shadow: 0 6px 0 var(--ledge), 0 14px 34px rgba(59, 47, 92, .12); }

  /* chunky springy buttons */
  .btn { --c: var(--sky); --cd: var(--sky-d); border: 0; color: #fff; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 16px;
    cursor: pointer; background: var(--c); box-shadow: 0 5px 0 var(--cd), 0 9px 18px rgba(59, 47, 92, .16); text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; transform: translateY(0) scale(1); text-shadow: 0 1px 0 rgba(0, 0, 0, .12);
    transition: transform .32s var(--spring), box-shadow .18s var(--out), filter .2s, opacity .2s; will-change: transform; }
  .btn:hover { transform: translateY(-2px) scale(1.05); filter: brightness(1.06); }
  .btn:active, .btn.press { transform: translateY(4px) scale(.95); box-shadow: 0 1px 0 var(--cd), 0 3px 8px rgba(59, 47, 92, .16); transition-duration: .07s; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; filter: grayscale(.4); }
  .btn:focus-visible, #scrub:focus-visible, .area:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn svg { width: 18px; height: 18px; }
  .coral { --c: var(--coral); --cd: var(--coral-d); } .sun { --c: var(--sun); --cd: var(--sun-d); color: #5a3d00; text-shadow: none; }
  .mint { --c: var(--mint); --cd: var(--mint-d); } .lilac { --c: var(--lilac); --cd: var(--lilac-d); }
  .ghost { --c: #f1edff; --cd: #d8d0f5; color: var(--ink); text-shadow: none; }
  .huge { font-size: 22px; padding: 16px 28px; border-radius: 22px; }

  #title { position: fixed; top: 16px; left: 16px; display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; }
  #title .logo { width: 46px; height: 46px; border-radius: 15px; background: linear-gradient(160deg, #ffe08a, #ffb86b); display: grid; place-items: center;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .08); animation: bob 2.6s ease-in-out infinite; }
  #title .logo svg { width: 36px; height: 36px; }
  #title h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1; }
  #title h1 span { color: var(--coral); }
  #title p { margin: 3px 0 0; color: var(--soft); font-size: 13px; }

  #top { position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; align-items: center; }
  .switch { display: inline-flex; padding: 4px; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 var(--ledge); }
  .switch a, .switch span { padding: 7px 14px; border-radius: 12px; font-weight: 600; text-decoration: none; color: var(--soft); transition: background .2s, color .2s, transform .3s var(--spring); }
  .switch span { background: var(--coral); color: #fff; box-shadow: 0 3px 0 var(--coral-d); }
  .switch a:hover { color: var(--ink); background: #f1edff; transform: scale(1.05); }

  /* the score: big, central, one dot per bird */
  #score { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 20px 10px; text-align: center; }
  #score .n { font-size: 30px; font-weight: 700; line-height: 1.05; } #score .n b { color: var(--mint-d); }
  #score .n.bump { animation: bump .5s var(--spring); }
  #score .dots { display: flex; gap: 6px; justify-content: center; margin-top: 5px; }
  #score .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--c); background: #fff; transition: background .3s, transform .4s var(--spring); }
  #score .dots i.on { background: var(--c); transform: scale(1.15); }

  /* station boards: slim column of mini cards */
  #stations { position: fixed; left: 16px; top: 92px; width: 236px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 210px); overflow-y: auto; scrollbar-width: none; padding: 2px 2px 8px; }
  .st { padding: 10px 12px 8px; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 var(--ledge), 0 10px 22px rgba(59, 47, 92, .1); transition: transform .3s var(--spring); }
  .st:hover, .st.hl { transform: scale(1.03) translateX(3px); }
  .st-h { display: flex; align-items: center; gap: 8px; }
  .st-h .ic { width: 26px; height: 26px; border-radius: 9px; background: var(--hc); display: grid; place-items: center; font-weight: 700; font-size: 14px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .1); }
  .st-h .seen { margin-left: auto; color: var(--soft); font-size: 12px; } .st-h .seen b { color: var(--ink); font-size: 18px; margin-right: 2px; }
  .st-h .seen b.bump { display: inline-block; animation: bump .45s var(--spring); }
  .meter { height: 8px; border-radius: 6px; background: #efeaff; margin: 8px 0 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, #ffc23c, #3ddc97); transform-origin: 0 50%; transform: scaleX(0); will-change: transform; }
  .st-m { display: flex; justify-content: space-between; color: var(--soft); font-size: 11.5px; }
  .st-m .pct { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .st svg { display: block; width: 100%; height: 38px; margin-top: 4px; border-radius: 8px; background: #faf8ff; }

  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(820px, calc(100% - 32px)); display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  #play { width: 60px; height: 60px; border-radius: 20px; padding: 0; flex: none; }
  #play svg { width: 26px; height: 26px; }
  #clockwrap { flex: none; text-align: center; min-width: 84px; }
  #left { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; } #clockwrap small { color: var(--soft); font-size: 12px; display: block; }
  #speeds { display: flex; gap: 6px; flex: none; }
  #speeds .btn { padding: 7px 10px; font-size: 14px; border-radius: 12px; }
  #speeds .btn.on { --c: var(--lilac); --cd: var(--lilac-d); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .12); }
  #scrub { position: relative; flex: 1; height: 44px; cursor: pointer; touch-action: none; border-radius: 16px; }
  #track { position: absolute; left: 0; right: 0; top: 10px; height: 24px; border-radius: 12px; background: #efeaff; overflow: hidden; box-shadow: inset 0 3px 0 rgba(59, 47, 92, .08); }
  #strip { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fill { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(169, 139, 255, .28), rgba(255, 107, 129, .28)); transform-origin: 0 50%; transform: scaleX(0); will-change: transform; }
  #thumb { position: absolute; top: 2px; left: 0; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 4px 0 var(--ledge), 0 6px 14px rgba(59, 47, 92, .22); will-change: transform; }
  #thumbicon { display: grid; place-items: center; } #thumbicon svg { width: 30px; height: 30px; transition: transform .3s var(--spring); }
  #scrub.drag #thumbicon svg { transform: scale(1.22) rotate(-8deg); }
  .bubble { position: absolute; bottom: 50px; left: 0; padding: 4px 10px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;
    transform: translateX(-50%) scale(.6); opacity: 0; transition: opacity .15s, transform .3s var(--spring); pointer-events: none; font-variant-numeric: tabular-nums; }
  #thumb .bubble { left: 50%; bottom: 48px; } .bubble.on { opacity: 1; transform: translateX(-50%) scale(1); } #ghost { background: rgba(59, 47, 92, .75); }

  /* placement */
  #place { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  #place .txt { flex: 1; } #place .txt b { font-size: 18px; } #place .txt p { margin: 2px 0 0; color: var(--soft); font-size: 13px; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; background: #f1edff; border-radius: 12px; padding: 3px; }
  .stepper button { width: 26px; height: 26px; border: 0; border-radius: 9px; background: #fff; color: var(--ink); font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 var(--ledge); transition: transform .25s var(--spring); }
  .stepper button:active { transform: scale(.88); } .stepper span { min-width: 64px; text-align: center; font-weight: 600; font-size: 13px; }
  #release.busy { pointer-events: none; } #release.busy .lbl::after { content: '…'; }

  /* overlays: area picker, end card */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(59, 47, 92, .18); backdrop-filter: blur(3px); z-index: 3; opacity: 0; pointer-events: none; transition: opacity .35s var(--out); }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .overlay > .card { padding: 26px 28px; text-align: center; width: min(560px, calc(100% - 32px)); transform: scale(.85) translateY(20px); transition: transform .5s var(--spring); }
  .overlay.on > .card { transform: none; }
  .overlay h2 { margin: 0 0 4px; font-size: 28px; } .overlay p { margin: 0 0 16px; color: var(--soft); }
  #areas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .area { border: 0; border-radius: 18px; padding: 14px; cursor: pointer; text-align: left; color: var(--ink); background: var(--bg); box-shadow: 0 5px 0 rgba(59, 47, 92, .12);
    transition: transform .3s var(--spring); }
  .area:hover { transform: translateY(-3px) scale(1.04) rotate(-1deg); } .area:active { transform: scale(.96); }
  .area b { display: block; font-size: 17px; } .area small { color: var(--soft); }
  .area .e { font-size: 26px; display: block; margin-bottom: 4px; }
  #stars { font-size: 44px; letter-spacing: 6px; margin: 4px 0 2px; } #stars i { font-style: normal; display: inline-block; animation: star .6s var(--spring) both; }
  #stars i.off { filter: grayscale(1) opacity(.3); }
  #best { color: var(--soft); margin-bottom: 18px; } .end-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* world-anchored bits: outer moves (transform only), inner animates */
  #labels > div { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
  .tag { transform: translate(-50%, -100%) scale(.6); opacity: 0; padding: 4px 10px; border-radius: 99px; background: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; border: 2.5px solid var(--id);
    box-shadow: 0 3px 0 rgba(59, 47, 92, .12); transition: transform .35s var(--spring), opacity .15s; }
  .tag.on { opacity: 1; transform: translate(-50%, -100%) scale(1); } .tag small { color: var(--soft); font-weight: 500; }
  .sign { transform: translate(-50%, -100%); width: 22px; height: 22px; border-radius: 8px; background: var(--hc); border: 2px solid #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 0 var(--ledge); }
  .check { transform: translate(-50%, -100%) scale(0); width: 22px; height: 22px; border-radius: 50%; background: var(--mint); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    border: 2px solid #fff; box-shadow: 0 2px 0 rgba(31, 174, 116, .5); transition: transform .45s var(--spring); }
  .check.on { transform: translate(-50%, -100%) scale(1); }
  .say { position: absolute; transform: translate(-50%, -100%) scale(.2); opacity: 0; padding: 6px 12px; border-radius: 14px; background: var(--mint); color: #fff; font-size: 16px; font-weight: 700; white-space: nowrap;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .15); box-shadow: 0 4px 0 var(--mint-d), 0 8px 16px rgba(59, 47, 92, .15); transition: opacity .2s, transform .45s var(--spring); }
  .say.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .ping { transform: translate(-50%, -100%) scale(.3); opacity: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--sun); color: #5a3d00; font-weight: 700; display: grid; place-items: center;
    border: 2px solid #fff; transition: opacity .2s, transform .4s var(--spring); }
  .ping.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }

  #toast { position: fixed; left: 50%; top: 96px; transform: translate(-50%, -12px); padding: 10px 16px; border-radius: 14px; background: var(--ink); color: #fff; opacity: 0; transition: opacity .25s, transform .4s var(--spring); z-index: 4; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #74cbff, #ffeccc); z-index: 5; transition: opacity .6s var(--out); }
  #loading .card { padding: 22px 30px; text-align: center; font-size: 18px; font-weight: 600; }
  .dots3 span { display: inline-block; width: 12px; height: 12px; margin: 10px 4px 0; border-radius: 50%; background: var(--coral); animation: hop 1s var(--spring) infinite; }
  .dots3 span:nth-child(2) { background: var(--sun); animation-delay: .12s; } .dots3 span:nth-child(3) { background: var(--mint); animation-delay: .24s; }

  /* which bits show in which phase */
  body:not([data-mode="place"]):not([data-mode="loading"]) #place, body:not([data-mode="round"]):not([data-mode="end"]) :is(#bar, #score, #stations) { display: none; }
  .enter { animation: enter .6s var(--spring) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(24px) scale(.92); } }
  #bar.enter, #place.enter { animation-name: enterbar; } @keyframes enterbar { from { opacity: 0; transform: translate(-50%, 40px) scale(.9); } }
  #score.enter { animation-name: enterscore; } @keyframes enterscore { from { opacity: 0; transform: translate(-50%, -30px) scale(.8); } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
  @keyframes bump { 40% { transform: scale(1.3); } }
  @keyframes hop { 50% { transform: translateY(-10px); } }
  @keyframes star { from { transform: scale(0) rotate(-40deg); } }

  @media (max-width: 760px) {
    #title { top: 10px; left: 10px; padding: 5px 10px 5px 5px; } #title .logo { width: 36px; height: 36px; } #title .logo svg { width: 28px; height: 28px; }
    #title h1 { font-size: 17px; } #title p { display: none; }
    #top { top: 10px; right: 10px; gap: 6px; } #top .lbl { display: none; } #top .btn { padding: 9px; } .switch a, .switch span { padding: 6px 9px; font-size: 13px; }
    #score { top: 64px; padding: 6px 14px 8px; } #score .n { font-size: 22px; }
    #stations { top: auto; bottom: 150px; left: 10px; right: 10px; width: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; max-height: none; }
    .st { flex: none; width: 188px; }
    #bar { bottom: 10px; width: calc(100% - 20px); gap: 10px; padding: 10px; flex-wrap: wrap; }
    #play { width: 50px; height: 50px; } #scrub { order: 3; flex-basis: 100%; } #speeds { margin-left: auto; } #speeds .btn { padding: 6px 8px; font-size: 13px; }
    #place { bottom: 10px; width: calc(100% - 20px); flex-direction: column; align-items: stretch; text-align: center; } #place .huge { width: 100%; }
    #areas { grid-template-columns: 1fr; } .overlay > .card { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body data-mode="boot">
<div id="loading"><div class="card">Waking up the birds<div class="dots3"><span></span><span></span><span></span></div></div></div>
<div class="hud">
  <div id="labels"></div>
  <header id="title" class="card enter"><div class="logo" id="logo"></div><div><h1>Sky <span>Spotters</span></h1><p id="sub"></p></div></header>
  <div id="top" class="enter" style="animation-delay:.08s">
    <button id="overview" class="btn ghost" title="Back to the whole board (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
    <button id="sound" class="btn lilac" aria-pressed="false" title="Sounds (off)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="snd-x" d="M17 9l4 6M21 9l-4 6"/><path id="snd-w" d="M17 8a5 5 0 0 1 0 8" style="display:none"/></svg></button>
    <nav class="switch" aria-label="View"><span aria-current="page">Simple</span><a id="toPro" href="../viewer/">Pro</a></nav>
  </div>
  <div id="score" class="card enter"><div class="n" id="scoreN">Caught <b>0</b> / 0</div><div class="dots" id="scoreDots"></div></div>
  <div id="stations"></div>
  <div id="place" class="card enter">
    <div class="txt"><b id="placeTitle">Place your huts</b><p>Tap the map to drop a hut · drag to move · tap to remove</p>
      <button id="where" class="btn ghost" style="padding:5px 10px;font-size:13px;border-radius:10px;margin:6px 6px 0 0">Change place</button><div class="stepper" title="How many birds fly this round"><button id="bminus" aria-label="Fewer birds">−</button><span id="bcount">6 birds</span><button id="bplus" aria-label="More birds">+</button></div></div>
    <button id="release" class="btn coral huge"><span class="lbl">Release the birds!</span></button>
  </div>
  <div id="bar" class="card">
    <button id="play" class="btn coral" aria-label="Play"></button>
    <div id="clockwrap"><div id="left">10:00</div><small>left</small></div>
    <div id="scrub" role="slider" tabindex="0" aria-label="Time" aria-valuemin="0">
      <div id="track"><canvas id="strip"></canvas><div id="fill"></div></div>
      <div id="thumb"><span id="thumbicon"></span><div class="bubble" id="tbubble"></div></div>
      <div class="bubble" id="ghost"></div>
    </div>
    <div id="speeds"></div>
  </div>
</div>
<div id="picker" class="overlay"><div class="card"><h2>Where do we watch?</h2><p>Pick a place. Real terrain, cute birds.</p><div id="areas"></div></div></div>
<div id="endcard" class="overlay"><div class="card"><div id="stars"></div><h2 id="endTitle"></h2><div id="best"></div>
  <div class="end-btns"><button id="again" class="btn coral huge">Play again</button><button id="move" class="btn sky huge">Move stations</button></div></div></div>
<div id="toast"></div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const VEX = 5;           // vertical exaggeration: lumpier, cuter hills (birds use the same mapping, so heights stay true)
const BIRD_PX = 64;      // birds are drawn this many pixels long at any zoom
const MAX_HUTS = 6, ROUND_SPEED = 10;   // a 600 s round plays in ~60 s
const ID = ['#ff6b81', '#4fb8ff', '#ffc23c', '#3ddc97', '#a98bff', '#ff9f43', '#22d3ee', '#f472b6'];
const HUTC = ['#c8f4dd', '#ffe1ec', '#e3dcff', '#d8efff', '#fff1c7', '#ffe0cc'];
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);   // frame-rate independent easing factor
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const ease = { inOut: k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2, outBack: k => { const c = 1.9; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; } };

// ---------- hover, follow, camera flights ----------

function follow(id) {

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();

// placement gestures: tap land = add, drag a hut = move, tap a hut = remove (captured before the camera controls see them)
let gesture = null;
addEventListener('pointerdown', e => {

}, true);
renderer.domElement.addEventListener('pointermove', e => {

});
addEventListener('pointerup', e => {

}, true);
function setHover(id) { hovered = id; renderer.domElement.style.cursor = id ? 'pointer' : ''; }
addEventListener('keydown', e => {

// ---------- end of round ----------
const bestKey = () => `skyspotters:best:${AREA.id}:${nBirds}`;
function showEnd() {

  const caught = R.objIds.filter(id => R.caughtAt[id] < R.N).length, n = R.objIds.length, ratio = caught / Math.max(n, 1);
  let best = caught;
  try { best = Math.max(caught, +localStorage.getItem(bestKey()) || 0); localStorage.setItem(bestKey(), best); } catch { /* private mode: no best score */ }
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
  $('#stars').innerHTML = [0, 1, 2].map(k => `<i class="${k < stars ? '' : 'off'}" style="animation-delay:${.15 + k * .15}s">⭐</i>`).join('');

}
$('#again').onclick = () => { sfx.pop(); $('#endcard').classList.remove('on'); startRound(Math.floor(Math.random() * 1e6), 0, true); };
$('#move').onclick = () => { sfx.pop(); $('#endcard').classList.remove('on'); overview(); toPlacement(); };

// ---------- per-second game events ----------
function onSecond(i, live) {

    const b = R.birds[id], [s0, s1] = R.spawn[id], caught = R.caughtAt[id] <= i;
    if (live && i === s0) { const tr = B.truth[id]; burst(toScene(tr.x[s0], tr.y[s0], tr.z[s0]), ['#ffffff', b.color], 14, .1 * D / 14, .9); sfx.plop(); }
    if (live && i === R.caughtAt[id]) {
      b.say.classList.add('on'); b.sayUntil = performance.now() + 1800;
      burst(b.root.position, [b.color, '#ffc23c', '#ffffff', '#3ddc97'], 30, b.root.scale.x * .32, b.root.scale.x * 2.4); sfx.chirp();
    }
    b.check.classList.toggle('on', caught);
    b.dot.classList.toggle('on', caught);
    const heard = B.sensors.filter(s => B.links[`${s.id}|${id}`]?.det[i]).map((s, k) => s.id);
    if (live && !caught && heard.length && !R.fixAt[id].has(B.t[i]) && !(i > 0 && B.sensors.some(s => B.links[`${s.id}|${id}`]?.det[i - 1]))) {
      b.ping.classList.add('on'); b.pingUntil = performance.now() + 1100; sfx.ping();
    }
    b.heardBy = heard.map(sid => `Hut ${B.sensors.findIndex(s => s.id === sid) + 1}`);
    b.caught = caught; b.inWin = i >= s0 && i <= s1;
  }
  for (const st of stations) {
    if (!st.id) continue;
    let sum = 0, n = 0, target = null;
    for (const [id, bm] of Object.entries(st.beams)) {
      const on = !!bm.L.det[i]; bm.on = on; bm.bearing = bm.L.bearing[i];
      if (on) { sum += clamp((bm.L.snr[i] - st.thr) / 20, 0, 1); n++; if (!target || bm.L.snr[i] > target.L.snr[i]) target = bm; }

    }
    st.target = target; st.confGoal = n ? sum / n : 0; st.pct.textContent = n ? `${Math.round(st.confGoal * 100)} %` : '–';
    const seen = Object.values(st.first).filter(fd => fd <= i).length;

  }

  if (caughtN !== R.shownCaught) {
    $('#scoreN').innerHTML = `Caught <b>${caughtN}</b> / ${R.objIds.length}`;
    if (live && R.shownCaught >= 0) { $('#scoreN').classList.remove('bump'); void $('#scoreN').offsetWidth; $('#scoreN').classList.add('bump'); }

}

// ---------- the frame loop ----------
const rad = Math.PI / 180, v3 = new THREE.Vector3(), tmp = new THREE.Vector3();
let last = performance.now(), clock = 0;
const sizeK = () => 2 * Math.tan(camera.fov * rad / 2) / innerHeight;
const place = (o, p, dy = 0) => { v3.copy(p).project(camera); const vis = v3.z < 1; o.style.display = vis ? '' : 'none'; if (vis) o.style.transform = `translate3d(${((v3.x + 1) / 2 * innerWidth).toFixed(1)}px, ${((1 - v3.y) / 2 * innerHeight - dy).toFixed(1)}px, 0)`; };

function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now; clock += dt; introT += dt;
  requestAnimationFrame(frame);
  if (!board) return;
  if (R && mode === 'round' && playing && !dragging) { t += dt * speed; if (t >= R.N - 1) { t = R.N - 1; showEnd(); } }
  const i = R ? Math.min(Math.floor(t), R.N - 1) : 0, f = t - i, j = R ? Math.min(i + 1, R.N - 1) : 0;
  if (R && i !== lastI) {

    onSecond(i, live); lastI = i;
  }
  if (R && now - lastURL > 1500) { lastURL = now; syncURL(); }

  if (introT < 4) {   // pop-in of trees and houses, then never touched again
    const dirty = new Set();
    for (const [im, k, it] of popItems) { const kk = clamp((introT - it.delay) / .55, 0, 1); if (kk > 0 && !it.done) { setInst(im, k, it, ease.outBack(kk)); dirty.add(im); if (kk === 1) it.done = true; } }
    dirty.forEach(im => im.instanceMatrix.needsUpdate = true);

    if (following && fly.off && R) { fly.t1.copy(R.birds[following].root.position); fly.p1.copy(fly.t1).add(fly.off); }   // land on the moving bird

    if (fly.t >= fly.dur) fly = null;

    const step = tmp.copy(R.birds[following].root.position).sub(controls.target).multiplyScalar(damp(5, dt));
    controls.target.add(step); camera.position.add(step);
  }

  const kpx = sizeK();

    const b = R.birds[id], tr = R.B.truth[id], L = a => a[i] + (a[j] - a[i]) * f, [s0, s1] = R.spawn[id];

    const hd = tr.h ? tr.h[i] + ((((tr.h[j] - tr.h[i]) % 360) + 540) % 360 - 180) * f : Math.atan2(tr.x[j] - tr.x[i], tr.y[j] - tr.y[i]) / rad;

    const spd = Math.hypot(tr.x[j] - tr.x[i], tr.y[j] - tr.y[i]), climb = tr.z[j] - tr.z[i], roll = Math.abs(tr.r ? tr.r[i] : 0);

    const popK = REDUCED ? b.pop : ease.outBack(clamp(b.pop, 0, 1));
    const dist = camera.position.distanceTo(b.root.position), s = dist * kpx * BIRD_PX / b.norm * b.sp.size * (1 + .3 * b.hl) * (1 + 1.3 * b.fk) * popK;
    b.root.scale.setScalar(Math.max(s, 1e-4));
    b.halo.material.opacity = .85 * b.hl * (.8 + .2 * Math.sin(clock * 5));
    b.ol.color.set(b.hl > .5 ? b.color : INK);
    const gy = toScene(x, y, groundH(x, y)).y, agl = b.root.position.y - gy;
    b.shadow.position.set(b.root.position.x, gy + .012, b.root.position.z);
    b.shadow.scale.setScalar(Math.max(s * 1.3 / (1 + agl * .8), 1e-4));
    b.shadow.material.opacity = clamp(.9 - agl * .35, .2, .9) * Math.min(popK, 1);
    const P = b.trail.geometry.attributes, c = srgb(b.color), n = P.size.count;
    for (let k = 0; k < n; k++) {
      const tt = Math.max(t - k * 1.2, s0), ii = Math.min(Math.floor(tt), R.N - 1), jj = Math.min(ii + 1, R.N - 1), ff = tt - ii;
      const p = toScene(tr.x[ii] + (tr.x[jj] - tr.x[ii]) * ff, tr.y[ii] + (tr.y[jj] - tr.y[ii]) * ff, tr.z[ii] + (tr.z[jj] - tr.z[ii]) * ff);
      P.position.setXYZ(k, p.x, p.y, p.z);
      const fade = 1 - k / n;
      P.size.setX(k, k < 2 || t - k * 1.2 < s0 ? 0 : s * (.16 + .2 * fade) * (1 + .4 * b.hl));
      P.rgba.setXYZW(k, .55 + .45 * c[0], .55 + .45 * c[1], .55 + .45 * c[2], fade * (.5 + .4 * b.hl) * Math.min(popK, 1));

    b.path.material.opacity += ((hl ? .95 : 0) - b.path.material.opacity) * damp(8, dt);
    b.path.visible = b.path.material.opacity > .02;
    b.path.material.dashOffset -= dt * .35;
    if (b.sayUntil && now > b.sayUntil) { b.say.classList.remove('on'); b.sayUntil = 0; }
    if (b.pingUntil && now > b.pingUntil) { b.ping.classList.remove('on'); b.pingUntil = 0; }
    // the type shows only on hover
    b.tag.classList.toggle('on', b.hl > .5);
    if (b.hl > .5) {
      const txt = `${b.sp.name} <small>· ${b.caught ? 'caught ✓' : b.heardBy?.length ? `heard by ${b.heardBy.join(', ')}` : 'hiding'}</small>`;
      if (b.tag.innerHTML !== txt) b.tag.innerHTML = txt;

    place(b.tagO, b.root.position, ps + 4); place(b.checkO, b.root.position, ps * .7); place(b.sayO, b.root.position, ps + 34); place(b.pingO, b.root.position, ps * .7);
  }

  // huts: pop in, lift when hovered or dragged, binoculars turn toward the strongest bearing they measure
  for (const st of stations) {
    if (!REDUCED) { st.v += (1 - st.pop) * 120 * dt; st.v *= Math.exp(-dt * 9); st.pop += st.v * dt; }

    st.bino.rotation.y += Math.atan2(Math.sin(goal - st.bino.rotation.y), Math.cos(goal - st.bino.rotation.y)) * damp(st.target ? 7 : 2, dt);

    for (const bm of Object.values(st.beams)) {

      st.clip.setAttribute('width', t.toFixed(1)); st.cur.setAttribute('x1', t.toFixed(1)); st.cur.setAttribute('x2', t.toFixed(1));

    }

  }
  water.position.y = (wl - base) * VEX / 1000 + Math.sin(clock * 1.3) * .004;
  for (const c of clouds) { const u = c.userData; u.a += dt * .012; c.position.set(CX + Math.cos(u.a) * u.r, u.y + Math.sin(clock * .5 + u.a * 3) * .08, CZ + Math.sin(u.a) * u.r * .8); }
  stepParticles(dt);
  renderer.render(scene, camera);

  if (R) {   // timeline: thumb eases toward the time, fill follows; transforms only
    const r = scrub.getBoundingClientRect(), goalX = (t / Math.max(R.N - 1, 1)) * r.width;
    thumbX = dragging || REDUCED ? goalX : thumbX + (goalX - thumbX) * damp(18, dt);
    thumb.style.transform = `translateX(${thumbX.toFixed(1)}px) scale(${dragging ? 1.12 : 1})`;
    $('#fill').style.transform = `scaleX(${(thumbX / Math.max(r.width, 1)).toFixed(4)})`;
    const left = fmtLeft(R.N - 1 - t);
    if ($('#left').textContent !== left) { $('#left').textContent = left; $('#tbubble').textContent = `${left} left`; scrub.setAttribute('aria-valuenow', i); scrub.setAttribute('aria-valuetext', `${left} left`); }
  }
}

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pathMats.forEach(m => m.resolution.set(innerWidth, innerHeight));
  pointsMat.uniforms.scale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(camera.fov * rad / 2));

}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
window.__cute = { camera, controls, follow, setHover, overview, get R() { return R; }, get mode() { return mode; }, get stations() { return stations; }, get t() { return t; }, set t(v) { t = v; }, setPlaying, showEnd };   // for screenshots and debugging

// ---------- boot: area from the URL or the picker; a full round in the URL resumes it ----------
try {
  AREAS = await getJSON('/api/areas');
  const a = AREAS.find(x => x.id === q.get('area'));
  const huts = (q.get('huts') ?? '').split(';').map(p => p.split(',').map(Number)).filter(p => p.length === 2 && p.every(Number.isFinite));
  if (a) {
    await loadArea(a, huts);
    if (q.has('seed') && q.has('birds') && stations.length) await startRound(+q.get('seed') || 0, +q.get('t') || 0, q.get('play') === '1');
  } else { await loadArea(AREAS.find(x => x.id === 'kaniv') ?? AREAS[0]); showPicker(); }   // a board behind the picker
} catch (err) {
  $('#loading .card').innerHTML = `The bird server is asleep 💤<br><small style="color:var(--soft)">Start it with <code>.venv/bin/python serve.py</code>, then reload.<br>${err.message}</small>`;
  throw err;
}
$('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 650);
</script>
